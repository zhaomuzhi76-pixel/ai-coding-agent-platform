embeddings:
- name: ollama-qwen3-emb
  provider: ollama-local
  model: qwen3-embedding:4b
  dimension: 4096
  default: true
- name: dashscope-text-emb-v3
  provider: dashscope-qwen
  model: text-embedding-v3
  dimension: 1024
  default: false
rerankers:
- name: ollama-qwen3-rerank
  provider: ollama-local
  model: pdurugyan/qwen3-reranker-0.6b-q8_0:latest
  default: true
vector_store:
  driver: chroma
  path: ./vector_db
  collection: code_index
  default_embedding: ollama-qwen3-emb
  default_reranker: ollama-qwen3-rerank
  top_k: 10
  rerank_top_k: 5
