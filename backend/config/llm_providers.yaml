agent_routing:
  intent:
  - ollama-local/qwen2.5-coder:7b
  - dashscope-qwen/qwen-plus
  plan:
  - dashscope-maas/qwen3.8-max
  - dashscope-qwen/qwen-max
  - ollama-local/qwen2.5-coder:7b
  - ollama-local/locooperator-4b-8k
